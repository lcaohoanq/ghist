root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/air-terminal ./scripts/air-terminal && go build -o ./tmp/ghist ./cmd/ghist"
bin = ""
entrypoint = ["./tmp/air-terminal"]
include_ext = ["go"]
include_file = ["go.mod", "go.sum"]
exclude_dir = ["tmp", "bin", ".git", "vendor"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "1s"
log = "build-errors.log"

[log]
silent = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
